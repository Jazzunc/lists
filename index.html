<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas 2026 Wishlists</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 { 
            text-align: center; 
            color: #ffffff; 
            margin-bottom: 10px; 
        }
        p.subtitle { 
            text-align: center; 
            color: #d0d0d0; 
            font-size: 0.95rem; 
            font-weight: 500; 
            background: #1e1e1e; 
            border: 1px solid #333; 
            display: table; 
            margin: 0 auto 32px auto; 
            padding: 6px 16px; 
            border-radius: 20px; 
        }

        .hub-container { 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
        }

        .person-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .person-card:hover { 
            border-color: #555; 
            transform: translateY(-2px); 
        }
        .person-card.tbd-card:hover {
            border-color: #333;
            transform: none;
        }

        .person-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
        }

        .list-btn {
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            background: #18222d;
            color: #ffffff;
            transition: background 0.2s, border-color 0.2s;
        }
        .list-btn:hover {
            background: #1e2d3d;
        }

        /* Individual Accent Borders */
        .btn-olivia { border: 1px solid #00a8e8; }
        .btn-olivia:hover { border-color: #33bceb; }

        .btn-soap { border: 1px solid #e09a92; }
        .btn-soap:hover { border-color: #f2b5ae; }

        .btn-annie { border: 1px solid #b388ff; }
        .btn-annie:hover { border-color: #d1b3ff; }

        .btn-joe { border: 1px solid #d98200; }
        .btn-joe:hover { border-color: #f09513; }

        /* TBD Status Badge */
        .tbd-badge {
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #777;
            background: #161616;
            border: 1px dashed #333;
        }
    </style>
</head>
<body>

    <h1>Christmas 2026</h1>
    <p class="subtitle">Wishlists</p>

    <div class="hub-container">

        <!-- Olivia -->
        <div class="person-card">
            <span class="person-name">Olivia</span>
            <a href="https://giftful.com/wishlists/9GHtEbNPJkSbqSQf7f2X" target="_blank" class="list-btn btn-olivia">View List</a>
        </div>

        <!-- Soap -->
        <div class="person-card">
            <span class="person-name">Soap</span>
            <a href="https://jazzunc.github.io/soap/" class="list-btn btn-soap">View List</a>
        </div>

        <!-- Annie -->
        <div class="person-card">
            <span class="person-name">Annie</span>
            <a href="https://jazzunc.github.io/annie/" class="list-btn btn-annie">View List</a>
        </div>

        <!-- Joe -->
        <div class="person-card">
            <span class="person-name">Joe</span>
            <a href="https://jazzunc.github.io/joe/" class="list-btn btn-joe">View List</a>
        </div>

        <!-- Ash -->
        <div class="person-card tbd-card">
            <span class="person-name" style="color: #9e9e9e;">Ash</span>
            <span class="tbd-badge">To be determined</span>
        </div>

    </div>

</body>
</html>
